[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cyber-threat-detection-framework"
version = "2.0.0"
description = "AI-Based Cyber Threat Detection Framework using ML & Behavioral Analytics"
authors = [{name = "AXAT", email = "info@axat.io"}]
dependencies = [
    "Flask>=3.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=cyber_threat --cov=app"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cyber_threat", "app", "predict"]

[tool.coverage.report]
show_missing = true
skip_covered = false
