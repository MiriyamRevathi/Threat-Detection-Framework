<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AI Cyber Threat Detection Framework{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;650;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>

<div class="ambient"><div class="radar-sweep"></div></div>

<div class="shell">

  <nav class="navbar">
    <div class="brand">
    <img src="{{ url_for('static', filename='images/logo.png') }}"
         alt="SentinelX Logo"
         class="brand-logo">

    <div class="brand-text">
        <span class="brand-title">SentinelX</span>
        <span class="brand-subtitle">Powered by TriXiE AI</span>
    </div>
    </div>
    
  </nav>

  {% block content %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
